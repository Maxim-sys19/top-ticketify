apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ticketify-route
  namespace: ticketify-dev
spec:
  parentRefs:
    - name: ticketify-gateway
  hostnames:
    - 'ticketify.local'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
